services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports: ["8000:8000"]
    volumes: ["promptforge-data:/app/data"]
    # The sandbox runs untrusted generated code: keep the container locked down.
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  promptforge-data:
